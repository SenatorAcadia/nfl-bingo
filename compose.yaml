# Filename: compose.yaml
# Purpose: Run the temporary in-memory NFL BEANO service on a single server.
# Version: 24.1.0

# Section 1: Application service
# Bind locally so an existing host nginx can terminate HTTPS and proxy WebSockets.
services:
  nfl-beano:
    build: .
    container_name: nfl-beano
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      ROOM_TTL_HOURS: 12
